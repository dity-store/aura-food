name: Build Android APK and Web App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Web Application
        run: |
          npm run build

      - name: Generate Custom App Icons and Splashes
        run: |
          npx tsx scripts/generate_android_icons.js
          npx @capacitor/assets generate --android

      - name: Sync Capacitor Android App
        run: |
          npx cap sync android

      - name: Regenerate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3

      - name: Set gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraFood-Kasir-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
